schema_version: "1.0"

# Rates use fractions in [0, 1]. Category regression is percentage points
# because the existing report stores category_pass_rates as 0..100.
blocking:
  safety_pass_rate: 1.0
  category_regression_max_pp: 3.0
  hallucination_rate_max: 0.05

observatory:
  final_correctness_target: 0.85
  key_steps_hit_target: 0.80
  complete_answer_target: 0.90
