    content: 计算 ∫ x dx。
  - role: assistant
    content: 原函数为 x²/2。
critic_expectation:
  verdict: pass
  must_check:
  - answered_question
  - derivation_closed
user_fixture: eval_standard_user
ai_offline_case: true
