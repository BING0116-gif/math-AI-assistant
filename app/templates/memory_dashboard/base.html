<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}记忆系统 Dashboard{% endblock %}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 20px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #00d4aa; margin-bottom: 24px; }
    h2 { color: #fff; font-size: 18px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card, .section, .profile-box, .memory-item { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px; }
    .stat-card h3 { color: #888; font-size: 14px; margin-bottom: 10px; }
    .stat-card .value { color: #00d4aa; font-size: 32px; font-weight: 700; }
    .stat-card.info .value { color: #4dabf7; }
    .stat-card.warning .value { color: #ff6b6b; }
    .section, .profile-box { margin-bottom: 20px; }
    .memory-item { background: #252525; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
    .type, .type-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-right: 10px; }
    .type-error { background: #ff6b6b; color: #fff; }
    .type-conversation { background: #4dabf7; color: #fff; }
    .type-milestone { background: #ffd43b; color: #000; }
    .type-profile { background: #69db7c; color: #000; }
    .type-unknown { background: #555; color: #fff; }
    .summary { margin-top: 8px; color: #ccc; font-size: 14px; line-height: 1.6; }
    .meta { margin-top: 8px; color: #777; font-size: 12px; }
    .progress-bar, .strength-bar { display: inline-block; width: 100px; height: 8px; margin-left: 10px; background: #333; border-radius: 4px; overflow: hidden; }
    .fill, .strength-fill { height: 100%; background: linear-gradient(90deg, #00d4aa, #69db7c); border-radius: 4px; }
    .refresh-btn { display: inline-block; background: #00d4aa; color: #000; border: 0; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 20px; text-decoration: none; }
    .back-link, a { color: #00d4aa; }
    .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; }
    .empty { color: #777; text-align: center; padding: 20px; }
    .footer { text-align: center; color: #666; margin-top: 30px; font-size: 12px; }
  </style>
</head>
<body><main class="container">{% block content %}{% endblock %}</main></body>
</html>
