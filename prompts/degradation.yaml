# 分级降级 L4 文案模板（路线图 4.4.1）。
# 降级回答绝不假装成功——这是数学助手的人格底线，也是评测集 tool_failure 类的判定标准。
# 加载失败时代码侧有同文案的硬编码兜底，本文件是唯一事实源。
version: 1
templates:
  model_failure: >-
    **【服务暂不可用】** AI 服务暂时不可用（已自动切换仍失败）。你的问题已保存，
    稍后点击重试即可，不会丢失上下文。
  timeout: >-
    **【⏰ 执行超时】** 这道题的推导超时了，已保留目前的过程。
    建议：把问题拆小一点再问，或稍后重试。
  tool_unavailable: >-
    **【功能暂不可用】** 该功能暂时不可用，我先用文字方式帮你。
    你可以把题目条件打出来。
