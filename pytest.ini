[pytest]
# Windows 下 %TEMP%\pytest-of-<user> 可能无写权限（WinError 5），
# 将 pytest 临时目录固定到仓库内（已被 .gitignore 忽略）。
# basetemp 仅支持 CLI 选项，故通过 addopts 传入。
addopts = --basetemp=.pytest_tmp
# 仓库根的 .pytest_cache 曾被外部进程长期锁定（空目录仍 WinError 5），
# 导致每次运行产生 PytestCacheWarning；缓存改存 .pytest_tmp（同样被忽略）。
cache_dir = .pytest_tmp/.pytest_cache
