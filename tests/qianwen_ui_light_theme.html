<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数学AI助手 - 亮色主题</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-coral: #FF6B6B;
      --primary-coral-hover: #F87171;
      --primary-coral-dark: #DC2626;
      --accent-purple: #4F46E5;

      --bg-main: #F3F6FA;
      --bg-card: #FFFFFF;
      --bg-sidebar: #F8FAFC;
      --bg-topbar: #FFFFFF;

      --text-primary: #1E293B;
      --text-secondary: #64748B;
      --text-tertiary: #94A3B8;

      --border-default: #CBD5E1;
      --border-light: #E2E8F0;
      --border-subtle: #F1F5F9;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);

      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --radius-xl: 20px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text-primary);
    }

    .app-container {
      width: 100%;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    body.sidebar-open .app-container {
      margin-left: 280px;
    }

    /* ====== 侧边栏组�?====== */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 280px;
      background: var(--bg-sidebar);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1.5px solid var(--border-light);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: none;
    }

    .sidebar.open {
      transform: translateX(0);
      box-shadow: 8px 0 32px rgba(0, 0, 0, 0.08);
    }

    .sidebar-header {
      padding: 24px 20px 20px;
      border-bottom: 1.5px solid var(--border-light);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent-purple) 0%, #7C3AED 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.25);
      flex-shrink: 0;
    }

    .logo-icon svg {
      width: 26px;
      height: 26px;
      fill: white;
    }

    .logo-text h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .logo-text p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* 新建对话按钮 - 暖金色主按钮 */
    .new-chat-btn {
      width: 100%;
      padding: 12px 24px;
      margin-top: 16px;
      background: linear-gradient(135deg, var(--primary-coral) 0%, var(--primary-coral-hover) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
      box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .new-chat-btn:hover {
      background: linear-gradient(135deg, var(--primary-coral-hover) 0%, var(--primary-coral-dark) 100%);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .new-chat-btn:active {
      transform: translateY(0);
      box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .new-chat-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
    }

    .nav-section-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 12px 12px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      margin-bottom: 3px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      font-weight: 500;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .nav-item:hover {
      background: rgba(245, 158, 11, 0.08);
      color: var(--primary-coral);
      transform: translateX(3px);
    }

    .nav-item.active {
      background: rgba(245, 158, 11, 0.12);
      color: var(--primary-coral);
      font-weight: 600;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .nav-badge {
      margin-left: auto;
      background: var(--accent-purple);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 9999px;
      min-width: 22px;
      text-align: center;
    }

    .sidebar-footer {
      padding: 16px 16px 20px;
      border-top: 1.5px solid var(--border-light);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent-purple) 0%, #7C3AED 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .user-plan {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .sidebar-toggle {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-md);
    }

    .sidebar-toggle:hover {
      border-color: var(--primary-coral);
      transform: translateY(-50%) scale(1.05);
      box-shadow: var(--shadow-lg);
    }

    .sidebar-toggle.open {
      left: 296px;
    }

    .sidebar-toggle svg {
      width: 22px;
      height: 22px;
      stroke: var(--text-secondary);
      fill: none;
      stroke-width: 2.5;
      transition: transform 0.35s ease;
    }

    .sidebar-toggle.open svg {
      transform: rotate(180deg);
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .sidebar-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .welcome-section {
      position: fixed;
      top: 18%;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 1.2s cubic-bezier(0.22, 1, 0.36, 1),
                  left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
      pointer-events: none;
    }

    body.sidebar-open .welcome-section {
      left: 280px;
      right: 0;
    }

    .welcome-section.hidden {
      opacity: 0;
      transform: translateY(-60px);
      pointer-events: none;
    }

    .welcome-content {
      text-align: center;
      animation: fadeInUp 0.8s ease-out;
      pointer-events: auto;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, var(--primary-coral) 0%, var(--primary-coral-hover) 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(245, 158, 11, 0.25), 0 4px 16px rgba(245, 158, 11, 0.15);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .welcome-icon svg {
      width: 44px;
      height: 44px;
      fill: white;
    }

    .welcome-title {
      font-size: 36px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .welcome-subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .input-container {
      position: fixed;
      left: 50%;
      width: 100%;
      max-width: 720px;
      padding: 0 24px;
      z-index: 100;
      transition: top 1.8s cubic-bezier(0.22, 1, 0.36, 1),
                  bottom 1.8s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 1.8s cubic-bezier(0.22, 1, 0.36, 1),
                  left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-container.initial {
      top: 52%;
      transform: translateX(-50%) translateY(-50%);
    }

    .input-container.chat-mode {
      bottom: 32px;
      top: auto;
      transform: translateX(-50%) translateY(0);
    }

    body.sidebar-open .input-container {
      left: calc(50% + 140px);
    }

    /* ====== 输入容器 - 亮色主题 ====== */
    .input-wrapper {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1.5px solid var(--border-default);
      box-shadow: var(--shadow-md);
      transition: all 0.2s ease;
      overflow: visible;
      position: relative;
      padding: 16px 18px 14px;
    }

    .input-wrapper:hover,
    .input-wrapper:focus-within {
      border-color: var(--primary-coral);
      box-shadow: var(--shadow-lg);
    }

    .input-wrapper:focus-within {
      border-color: var(--primary-coral);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15), var(--shadow-lg);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 12px;
    }

    .main-input {
      flex: 1;
      min-height: 48px;
      max-height: 120px;
      padding: 12px 0;
      border: none;
      outline: none;
      font-size: 15.5px;
      line-height: 1.5;
      resize: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
    }

    .main-input::placeholder {
      color: var(--text-tertiary);
    }

    .input-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    /* 发送按�?- 暖金�?*/
    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--border-subtle);
      color: var(--text-tertiary);
      cursor: not-allowed;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .send-btn.active {
      background: linear-gradient(135deg, var(--primary-coral) 0%, var(--primary-coral-hover) 100%);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .send-btn.active:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .send-btn.active:active {
      transform: scale(0.96);
    }

    .send-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .voice-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .voice-btn:hover {
      background: var(--border-subtle);
      border-color: var(--primary-coral);
      color: var(--primary-coral);
    }

    .voice-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 10px;
      border-top: 1.5px solid var(--border-light);
    }

    .tool-btn-add {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-light);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .tool-btn-add:hover {
      border-color: var(--primary-coral);
      color: var(--primary-coral);
      background: rgba(245, 158, 11, 0.06);
      transform: scale(1.08);
    }

    .tool-btn-add svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
    }

    .divider-line {
      width: 1px;
      height: 22px;
      background: var(--border-light);
      margin: 0 6px;
      flex-shrink: 0;
    }

    /* 次要按钮 - 描边样式 */
    .tool-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 13px;
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      font-weight: 500;
      white-space: nowrap;
    }

    .tool-item:hover {
      background: #F1F5F9;
      border-color: var(--primary-coral);
      color: var(--primary-coral);
      transform: translateY(-1px);
    }

    .tool-item svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .messages-area {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 120px;
      overflow-y: auto;
      padding: 60px 15% 40px;
      display: none;
      flex-direction: column;
      gap: 32px;
      scroll-behavior: smooth;
      z-index: 5;
      transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .messages-area.show {
      display: flex;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    body.sidebar-open .messages-area {
      left: 280px;
    }

    .messages-area::-webkit-scrollbar {
      width: 7px;
    }

    .messages-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 10px;
    }

    .messages-area::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }

    .message-item {
      width: 100%;
      line-height: 1.8;
      font-size: 16px;
      animation: messageSlideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-user {
      text-align: right;
      color: var(--text-secondary);
    }

    .message-user .message-label {
      display: inline-block;
      font-size: 13px;
      color: var(--primary-coral);
      font-weight: 600;
      margin-bottom: 8px;
      padding-right: 4px;
    }

    .message-user .message-content {
      display: inline-block;
      max-width: 85%;
      text-align: left;
      color: var(--text-primary);
      font-weight: 500;
    }

    .message-ai {
      text-align: left;
      color: var(--text-primary);
    }

    .message-ai .message-content {
      display: block;
      width: 100%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message-ai .message-content p {
      margin-bottom: 16px;
      line-height: 1.8;
    }

    .message-ai .message-content p:last-child {
      margin-bottom: 0;
    }

    .message-ai .message-content strong {
      font-weight: 700;
      color: var(--accent-purple);
    }

    .message-ai .message-content ul,
    .message-ai .message-content ol {
      margin: 12px 0;
      padding-left: 24px;
    }

    .message-ai .message-content li {
      margin-bottom: 8px;
      line-height: 1.7;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 280px;
      }

      .sidebar-toggle {
        left: 12px;
        width: 40px;
        height: 40px;
      }

      .sidebar-toggle.open {
        left: 292px;
      }

      .app-container.sidebar-open {
        margin-left: 0;
      }

      .welcome-section {
        top: 14%;
      }

      .welcome-title {
        font-size: 28px;
      }

      .welcome-subtitle {
        font-size: 16px;
      }

      .welcome-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 18px;
      }

      .welcome-icon svg {
        width: 34px;
        height: 34px;
      }

      .input-container {
        padding: 0 16px;
        max-width: 100%;
      }

      .input-container.initial {
        top: 54%;
      }

      .input-container.chat-mode {
        bottom: 20px;
      }

      .main-input {
        min-height: 50px;
        padding: 14px 0;
        font-size: 15px;
      }

      .send-btn {
        width: 42px;
        height: 42px;
      }

      .messages-area {
        bottom: 100px;
        padding: 30px 5% 20px;
        gap: 24px;
      }

      .message-item {
        font-size: 15px;
        line-height: 1.7;
      }

      .message-user .message-content {
        max-width: 90%;
      }
    }

    @media (max-width: 480px) {
      .welcome-section {
        top: 10%;
      }

      .welcome-title {
        font-size: 24px;
      }

      .welcome-subtitle {
        font-size: 14.5px;
      }

      .sidebar-toggle {
        left: 8px;
        width: 38px;
        height: 38px;
      }

      .sidebar-toggle.open {
        left: 288px;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="logo-text">
          <h2>数学AI助手</h2>
          <p>Agent v2.0</p>
        </div>
      </div>
      <button class="new-chat-btn" onclick="startNewChat()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建对话
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">核心功能</div>

      <button class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        智能对话
      </button>

      <button class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        错题本管�?        <span class="nav-badge">12</span>
      </button>

      <button class="nav-item">

  <script>
    const mainInput = document.getElementById('mainInput');
    const sendBtn = document.getElementById('sendBtn');
    const inputContainer = document.getElementById('inputContainer');
    const welcomeSection = document.getElementById('welcomeSection');
    const messagesArea = document.getElementById('messagesArea');
    const toolbarRow = document.getElementById('toolbarRow');

    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const appContainer = document.getElementById('appContainer');

    let hasStartedChat = false;

    function toggleSidebar() {
      const isOpen = sidebar.classList.toggle('open');
      sidebarToggle.classList.toggle('open', isOpen);

      if (window.innerWidth > 768) {
        document.body.classList.toggle('sidebar-open', isOpen);
        sidebarOverlay.classList.remove('show');
      } else {
        document.body.classList.remove('sidebar-open');
        sidebarOverlay.classList.toggle('show', isOpen);
      }
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      sidebarToggle.classList.remove('open');
      sidebarOverlay.classList.remove('show');
      document.body.classList.remove('sidebar-open');
    }

    function startNewChat() {
      hasStartedChat = false;
      welcomeSection.classList.remove('hidden');
      inputContainer.classList.remove('chat-mode');
      inputContainer.classList.add('initial');
      toolbarRow.style.display = 'flex';
      messagesArea.classList.remove('show');
      messagesArea.innerHTML = '';
      mainInput.value = '';
      mainInput.style.height = 'auto';
      sendBtn.classList.remove('active');
      closeSidebar();
    }

    mainInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 140) + 'px';

      if (this.value.trim().length > 0) {
        sendBtn.classList.add('active');
      } else {
        sendBtn.classList.remove('active');
      }
    });

    function sendMessage() {
      const text = mainInput.value.trim();
      if (!text) return;

      if (!hasStartedChat) {
        hasStartedChat = true;

        welcomeSection.classList.add('hidden');

        inputContainer.classList.remove('initial');
        inputContainer.classList.add('chat-mode');

        setTimeout(() => {
          messagesArea.classList.add('show');
        }, 900);
      }

      addMessage(text, 'user');

      mainInput.value = '';
      mainInput.style.height = 'auto';
      sendBtn.classList.remove('active');

      setTimeout(() => {
        mainInput.focus();
      }, 200);

      setTimeout(() => {
        addMessage('这是一个演示回复。在实际应用中，这里会连接到后端API获取真实的AI回答。你可以继续输入其他数学问题进行测试�?, 'ai');
      }, 1500);

      scrollToBottom();
    }

    function addMessage(text, type) {
      const item = document.createElement('div');
      item.className = `message-item message-${type}`;

      if (type === 'user') {
        item.innerHTML = `
          <div class="message-label">�?/div>
          <div class="message-content">${escapeHtml(text)}</div>
        `;
      } else {
        item.innerHTML = `
          <div class="message-content">${formatMarkdown(text)}</div>
        `;
      }

      messagesArea.appendChild(item);
      scrollToBottom();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatMarkdown(text) {
      let html = escapeHtml(text);
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\n/g, '</p><p>');
      html = `<p>${html}</p>`;
      return html;
    }

    function scrollToBottom() {
      setTimeout(() => {
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }, 100);
    }

    sendBtn.addEventListener('click', sendMessage);

    sidebarToggle.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);

    mainInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth <= 768) {
        document.body.classList.remove('sidebar-open');
      } else if (sidebar.classList.contains('open')) {
        document.body.classList.add('sidebar-open');
      }
    });
  </script>
